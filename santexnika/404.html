<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#111211">
  <title>Страница не найдена — Дом Сантехники</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:#101111 url('/assets/hero-bathroom.jpg') center/cover fixed}
    body::after{position:fixed;inset:0;z-index:-1;content:"";background:linear-gradient(90deg,rgba(9,10,10,.94),rgba(9,10,10,.78)),linear-gradient(0deg,rgba(9,10,10,.55),transparent)}
    .error-page{width:min(620px,calc(100% - 36px));padding:55px 30px;border:1px solid rgba(216,174,115,.28);background:rgba(15,16,16,.87);text-align:center;backdrop-filter:blur(10px)}
    .error-number{margin:0;color:#d8ae73;font:400 clamp(100px,24vw,180px)/.9 Georgia,serif;letter-spacing:-.08em}
    .error-page h1{margin:19px 0 10px;font:400 clamp(32px,7vw,47px)/1.1 Georgia,serif}
    .error-page p{max-width:390px;margin:0 auto 25px;color:#aaa9a2;font-size:13px;line-height:1.7}
    .error-page .button{min-width:200px}
    @media(max-width:500px){.error-page{padding:40px 20px}}
  </style>
</head>
<body>
  <main class="error-page">
    <a class="brand" href="/" aria-label="Дом Сантехники — на главную" style="justify-content:center"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M7 31 32 10l25 21" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 29v27h36V29M25 56V39h14v17" stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 7c-4.8 6.1-7.2 9.7-7.2 12.5a7.2 7.2 0 1 0 14.4 0C53.2 16.7 50.8 13.1 46 7Z" fill="currentColor"/></svg></span><span class="brand-copy"><strong>ДОМ САНТЕХНИКИ</strong><small>БАЛАКОВО</small></span></a>
    <p class="error-number">404</p>
    <h1>Эта страница потерялась</h1>
    <p>Такой страницы нет или она переехала. Вернитесь на главную — там каталог, адреса магазинов и всё для вашей ванной.</p>
    <a class="button button-gold" href="/">На главную <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
